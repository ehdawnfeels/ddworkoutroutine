<title>Grind Log · Forma Flow MWFS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
  /* Layout: one phone-first column; each profile commits to its own look (Don dark, Dars light). */
  :root{
    --bg:#0a0a0a; --surface:#141414; --surface2:#1b1b1b; --border:#2a2a2a;
    --accent:#b8ff4f; --accent-dim:rgba(184,255,79,0.10); --accent-glow:rgba(184,255,79,0.22);
    --on-accent:#0a0a0a; --blue:#5fb8ff; --orange:#ffaa4f; --red:#ff6b6b; --good:#b8ff4f;
    --muted:#7a7a7a; --text:#e8e8e8; --text2:#aaa; --ghost:#5a5a5a;
    --don:#b8ff4f; --dars:#f08fb5; --warm:#5a5a5a; --cardio:#ffaa4f;
    --cat-move:#b8ff4f; --cat-commute:#7a7a7a; --cat-work:#5fb8ff; --cat-home:#ffaa4f; --cat-free:#c79bff; --cat-sleep:#4f6bd8;
    --display:'Bebas Neue',Impact,sans-serif; --display-tr:uppercase; --display-ls:2px;
    --body:'DM Sans',system-ui,sans-serif; --mono:'Space Mono',ui-monospace,monospace;
    color-scheme:dark;
  }
  body[data-profile="dars"]{
    --bg:#fbf4f2; --surface:#ffffff; --surface2:#fbeef0; --border:#eedde2;
    --accent:#d96a95; --accent-dim:rgba(217,106,149,0.10); --accent-glow:rgba(217,106,149,0.22);
    --on-accent:#ffffff; --blue:#b5658a; --orange:#cf8a6a; --red:#e0607f; --good:#5f9e80;
    --muted:#9a7b87; --text:#3b2a33; --text2:#7a5f6b; --ghost:#cfaeba;
    --don:#4f7a12; --dars:#d96a95; --warm:#d9c3cb; --cardio:#cf8a6a;
    --cat-move:#d96a95; --cat-commute:#c2aab3; --cat-work:#6f8fb8; --cat-home:#cf8a6a; --cat-free:#7fb79b; --cat-sleep:#6b5b9a;
    --display:'Fraunces',Georgia,serif; --display-tr:none; --display-ls:0px;
    color-scheme:light;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--body);min-height:100vh;overflow-x:hidden;
    transition:background .3s,color .3s}
  .container{max-width:880px;margin:0 auto;padding-block:0 60px;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  button{font-family:var(--body)}
  button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* header */
  header{padding-block:28px 20px;border-bottom:1px solid var(--border);margin-bottom:18px}
  .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
  .logo{font-family:var(--display);font-size:48px;letter-spacing:var(--display-ls);color:var(--accent);line-height:.9;text-transform:var(--display-tr)}
  .subtitle{font-size:11px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;font-family:var(--mono);margin-top:6px}
  .toggle{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:3px;flex-shrink:0}
  .toggle button{border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:600;padding:7px 16px;border-radius:999px;cursor:pointer;transition:.18s}
  .toggle button.on{background:var(--accent);color:var(--on-accent)}
  .stats-bar{display:flex;gap:8px 20px;margin-top:14px;flex-wrap:wrap}
  .stat{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.5px}
  .stat span{color:var(--accent);font-weight:700}

  .strip{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 14px;font-family:var(--mono);font-size:11px;color:var(--muted);flex-wrap:wrap}
  .deload{border:0;background:var(--accent-dim);color:var(--accent);font-weight:700;font-size:11px;padding:5px 11px;border-radius:999px;cursor:pointer;font-family:var(--mono)}
  .sync{font-family:var(--mono);font-size:10px;color:var(--ghost)}
  .vtabs{display:flex;gap:6px;margin-bottom:18px}
  .vtabs button{flex:1;min-width:0;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:12.5px;font-weight:600;padding:10px 4px;border-radius:9px;cursor:pointer;transition:.18s}
  .vtabs button.on{background:var(--text);color:var(--bg);border-color:var(--text)}

  /* day selector */
  .day-selector{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-bottom:24px}
  .day-btn{background:var(--surface);border:1px solid var(--border);color:var(--text2);padding:11px 4px;cursor:pointer;transition:.18s;text-align:center;border-radius:8px;min-width:0}
  .day-btn:hover{border-color:var(--accent);color:var(--text)}
  .day-btn.active{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .day-btn.today:not(.active){border-color:var(--accent)}
  .day-btn .abbr{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:1px;display:block;margin-bottom:3px}
  .day-btn .lab{font-size:9px;opacity:.8;display:block;line-height:1.25;overflow-wrap:anywhere}
  .day-btn.rest{opacity:.5}
  .dot{width:5px;height:5px;background:var(--accent);border-radius:50%;margin:5px auto 0;opacity:0}
  .day-btn.done .dot{opacity:1}
  .day-btn.active .dot{background:var(--on-accent)}

  /* panel */
  .panel{animation:fadeUp .3s cubic-bezier(.16,1,.3,1)}
  @keyframes fadeUp{from{opacity:.4;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .day-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:12px;flex-wrap:wrap}
  .day-title{font-family:var(--display);font-size:38px;letter-spacing:var(--display-ls);line-height:1;text-transform:var(--display-tr);text-wrap:balance}
  .day-title .num{color:var(--accent)}
  .day-meta{text-align:right;min-width:0}
  .day-tag{display:inline-block;background:var(--accent-dim);border:1px solid var(--accent);color:var(--accent);font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;padding:4px 9px;border-radius:3px;margin-bottom:6px}
  .day-desc{font-size:12px;color:var(--muted);max-width:270px}

  /* session clock */
  .clock{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:13px 13px 11px;margin-bottom:16px}
  .clock-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .clock-title{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent)}
  .clock-sum{font-family:var(--mono);font-size:10px;color:var(--muted)}
  .lane{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;margin-bottom:7px}
  .lane-name{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--text2)}
  .lane-name.you{color:var(--accent)}
  .bar{display:flex;height:22px;border-radius:5px;overflow:hidden;background:var(--surface2)}
  .seg{height:100%;border-right:1px solid var(--surface);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:9px;color:var(--on-accent);overflow:hidden;white-space:nowrap}
  .seg.w{background:var(--warm);color:var(--text)}
  .seg.c{background:var(--cardio)}
  .seg.b{background:transparent}
  .seg.don{background:var(--don)}
  .seg.dars{background:var(--dars);color:#fff}
  .seg.don.alt,.seg.dars.alt{filter:brightness(.82)}
  .axis{display:grid;grid-template-columns:44px 1fr;gap:8px}
  .ticks{position:relative;height:14px;font-family:var(--mono);font-size:9px;color:var(--ghost)}
  .ticks span{position:absolute;transform:translateX(-50%)}
  .ticks span:first-child{transform:none}.ticks span:last-child{transform:translateX(-100%)}
  .lane-note{font-size:11.5px;color:var(--text2);line-height:1.5;margin-top:8px}
  .lane-note b{color:var(--text);font-weight:600}
  .share{margin-top:8px;padding:7px 10px;border-left:2px solid var(--orange);background:color-mix(in srgb,var(--orange) 8%,transparent);border-radius:0 5px 5px 0;font-size:11.5px;color:var(--text2);line-height:1.5}

  .pbar{background:var(--surface);border:1px solid var(--border);border-radius:4px;height:6px;margin-bottom:18px;overflow:hidden}
  .pfill{height:100%;background:var(--accent);border-radius:4px;transition:width .4s cubic-bezier(.16,1,.3,1);box-shadow:0 0 12px var(--accent-glow);width:0%}

  /* blocks */
  .block{margin-bottom:14px;border:1px solid var(--blue);border-radius:11px;overflow:hidden;background:color-mix(in srgb,var(--blue) 6%,transparent)}
  .block.straight{border-color:var(--border);background:var(--surface)}
  .block.finisher{border-color:var(--orange);background:color-mix(in srgb,var(--orange) 6%,transparent)}
  .block-label{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 13px 5px;flex-wrap:wrap}
  .pill{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;padding:3px 8px;border-radius:3px;background:color-mix(in srgb,var(--blue) 15%,transparent);color:var(--blue);border:1px solid color-mix(in srgb,var(--blue) 30%,transparent)}
  .block.straight .pill{background:var(--accent-dim);color:var(--accent);border-color:var(--accent)}
  .block.finisher .pill{background:color-mix(in srgb,var(--orange) 15%,transparent);color:var(--orange);border-color:color-mix(in srgb,var(--orange) 30%,transparent)}
  .rest-lbl{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.5px}
  .howto{font-size:11.5px;color:var(--text2);padding:4px 13px 8px;line-height:1.5}
  .connector{display:flex;align-items:center;justify-content:center;padding:2px 13px;gap:9px}
  .cline{flex:1;height:1px;background:linear-gradient(to right,transparent,color-mix(in srgb,var(--blue) 30%,transparent),transparent)}
  .ctext{font-family:var(--mono);font-size:9px;color:var(--blue);letter-spacing:1.5px}

  /* exercise */
  .ex{border-top:1px solid color-mix(in srgb,var(--text) 6%,transparent)}
  .ex-head{display:flex;align-items:flex-start;padding:12px 13px;gap:11px}
  .check{width:22px;height:22px;border:2px solid var(--border);border-radius:50%;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;margin-top:1px;background:transparent}
  .check:hover{border-color:var(--accent)}
  .ex.done .check{background:var(--accent);border-color:var(--accent)}
  .check svg{display:none;color:var(--on-accent)}.ex.done .check svg{display:block}
  .ex.done .ex-name{opacity:.45;text-decoration:line-through}
  .ex-num{font-family:var(--mono);font-size:10px;color:var(--muted);width:15px;flex-shrink:0;margin-top:3px}
  .ex-body{flex:1;min-width:0}
  .ex-name{font-size:15px;font-weight:600;display:flex;align-items:center;gap:7px}
  .ex-name .star{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0}
  .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
  .tag{font-size:10px;font-family:var(--mono);padding:2px 7px;border-radius:3px;letter-spacing:.3px}
  .tag-s{background:var(--accent-dim);color:var(--accent)}
  .tag-m{background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue)}
  .tag-k{background:color-mix(in srgb,var(--orange) 14%,transparent);color:var(--orange)}
  .ghost{font-family:var(--mono);font-size:11px;color:var(--ghost);margin:9px 0 7px;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
  .pr{font-size:10px;color:var(--accent);background:var(--accent-dim);padding:2px 7px;border-radius:999px;font-weight:700;white-space:nowrap}
  .sets{display:flex;flex-direction:column;gap:6px}
  .setrow{display:flex;align-items:center;gap:7px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:5px 8px;flex-wrap:wrap;transition:.2s}
  .setrow.beat{border-color:var(--good);background:color-mix(in srgb,var(--good) 13%,transparent)}
  .setno{font-family:var(--mono);font-size:11px;color:var(--muted);width:14px;text-align:center}
  .setrow input{width:62px;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:7px;color:var(--text);font-size:14px;text-align:center;font-family:var(--mono)}
  .setrow .sep{color:var(--muted);font-size:12px}
  .effort{display:flex;gap:4px;margin-left:auto}
  .ebtn{border:1px solid var(--border);background:var(--bg);color:var(--muted);font-size:10px;font-weight:700;padding:6px 9px;border-radius:6px;cursor:pointer;font-family:var(--mono);letter-spacing:.5px;transition:.15s}
  .ebtn[data-e="easy"].on{background:var(--good);border-color:var(--good);color:var(--on-accent)}
  .ebtn[data-e="limit"].on{background:var(--orange);border-color:var(--orange);color:var(--on-accent)}
  .ebtn[data-e="fail"].on{background:var(--red);border-color:var(--red);color:#fff}
  .form-toggle{border:0;background:transparent;color:var(--blue);font-size:11.5px;font-weight:700;padding:9px 0 2px;cursor:pointer;font-family:var(--mono);letter-spacing:.5px}
  .form{padding:6px 0 4px}
  .form-title{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
  .steps{list-style:none;display:flex;flex-direction:column;gap:6px;counter-reset:s}
  .steps li{font-size:13px;color:var(--text2);padding-left:19px;position:relative;line-height:1.5;counter-increment:s}
  .steps li::before{content:counter(s);position:absolute;left:0;top:1px;font-family:var(--mono);font-size:10px;color:var(--accent);font-weight:700}
  .tip{margin-top:9px;padding:8px 11px;background:var(--accent-dim);border-left:2px solid var(--accent);border-radius:0 5px 5px 0;font-size:12.5px;color:var(--text2);line-height:1.5}
  .tip strong{color:var(--accent);font-size:10px;font-family:var(--mono);letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:3px}
  .cue{margin-top:7px;font-size:11.5px;color:var(--muted);font-style:italic}

  /* rest days */
  .restcard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:30px 22px;text-align:center}
  .restcard h3{font-family:var(--display);font-size:28px;letter-spacing:var(--display-ls);color:var(--accent);margin-bottom:8px;text-transform:var(--display-tr)}
  .restcard p{color:var(--text2);font-size:14px;line-height:1.7;max-width:460px;margin:0 auto}
  .restlist{list-style:none;text-align:left;display:inline-block;margin-top:16px}
  .restlist li{font-size:13px;color:var(--text2);padding:5px 0 5px 20px;position:relative;line-height:1.5}
  .restlist li::before{content:'→';position:absolute;left:0;color:var(--accent);font-family:var(--mono);font-size:11px;top:6px}

  .complete-wrap{margin-top:20px;text-align:center}
  .complete-btn{background:var(--accent);color:var(--on-accent);border:none;font-family:var(--display);font-size:19px;letter-spacing:2px;padding:14px 38px;cursor:pointer;border-radius:7px;transition:.2s;box-shadow:0 0 20px var(--accent-glow);text-transform:var(--display-tr)}
  .complete-btn.done{background:color-mix(in srgb,var(--accent) 25%,var(--surface));box-shadow:none;color:var(--accent)}
  .timer{position:sticky;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:7px 9px;box-shadow:0 8px 24px rgba(0,0,0,.3);margin:14px auto 0;width:max-content;max-width:100%}
  .tface{min-width:60px;text-align:center;font-size:15px;font-weight:700;cursor:pointer;color:var(--text);padding:6px 10px;border-radius:999px;background:var(--surface2);font-family:var(--mono);border:0}
  .tface.live{background:var(--accent);color:var(--on-accent)}
  .tbtns{display:flex;gap:5px}
  .tbtns button{border:1px solid var(--border);background:var(--bg);color:var(--muted);width:36px;height:33px;border-radius:999px;font-size:10px;cursor:pointer;font-family:var(--mono)}
  .tbtns button:hover{border-color:var(--accent);color:var(--accent)}

  /* progress */
  .prog-intro{font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.55}
  .plift{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:14px;margin-bottom:10px}
  .plift-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .plift-name{font-weight:600;font-size:14.5px}
  .plift-day{font-family:var(--mono);font-size:10px;color:var(--muted);background:var(--surface2);padding:2px 8px;border-radius:999px}
  .plift-best{display:flex;align-items:baseline;gap:8px;margin:7px 0 11px}
  .plift-best .big{font-family:var(--display);font-size:30px;color:var(--accent);line-height:1;letter-spacing:var(--display-ls);font-variant-numeric:tabular-nums}
  .plift .u{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .plift-best .u{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .spark{display:flex;align-items:flex-end;gap:4px;height:42px}
  .spark .b{width:11px;background:var(--accent);border-radius:3px 3px 0 0;opacity:.5;min-height:7px}
  .spark .b:last-child{opacity:1}
  .spark-empty{font-family:var(--mono);font-size:11px;color:var(--ghost)}
  .prog-note{font-size:12px;color:var(--muted);line-height:1.55;margin-top:16px;border-top:1px solid var(--border);padding-top:14px}

  /* plan notes */
  .notes{display:flex;flex-direction:column;gap:12px}
  .note{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:15px 16px}
  .note h4{font-family:var(--display);font-size:22px;letter-spacing:var(--display-ls);text-transform:var(--display-tr);color:var(--accent);margin-bottom:8px;font-weight:600}
  .note p,.note li{font-size:13px;color:var(--text2);line-height:1.6;max-width:66ch}
  .note ul{padding-left:18px;display:flex;flex-direction:column;gap:5px}
  .note b{color:var(--text);font-weight:600}
  .tbl{overflow-x:auto}
  .tbl table{border-collapse:collapse;width:100%;font-size:12px}
  .tbl table.wide{min-width:440px}
  .tbl th,.tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);color:var(--text2)}
  .tbl th{font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:400}
  .tbl td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--text)}

  /* cardio */
  .block.cardio{border-color:var(--cardio);background:color-mix(in srgb,var(--cardio) 7%,transparent)}
  .block.cardio .pill{background:color-mix(in srgb,var(--cardio) 16%,transparent);color:var(--cardio);border-color:color-mix(in srgb,var(--cardio) 35%,transparent)}
  .block.cardio.isdone .check{background:var(--accent);border-color:var(--accent)}
  .block.cardio.isdone .check svg{display:block}
  .copts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:7px;margin:9px 0}
  .copt{display:flex;flex-direction:column;gap:3px;text-align:left;border:1px solid var(--border);background:var(--surface2);color:var(--text2);border-radius:9px;padding:9px 10px;cursor:pointer;min-width:0;transition:.15s}
  .copt:hover{border-color:var(--cardio)}
  .copt.on{border-color:var(--cardio);background:color-mix(in srgb,var(--cardio) 14%,var(--surface));color:var(--text)}
  .copt-n{font-weight:600;font-size:13.5px;color:var(--text)}
  .copt-n em{font-style:normal;font-family:var(--mono);font-size:9px;letter-spacing:.5px;color:var(--cardio);margin-left:4px;text-transform:uppercase}
  .copt-s{font-size:11.5px;line-height:1.45}
  .cardio-row .eqchip.inline{margin:0 0 0 auto}
  .shower .ex{border-top:none}
  /* week */
  .wk-tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:18px}
  .wk-tab{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--border);background:var(--surface);color:var(--text2);border-radius:8px;padding:8px 2px;cursor:pointer;min-width:0}
  .wk-tab span{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:1px}
  .wk-tab small{font-family:var(--mono);font-size:9px;color:var(--muted)}
  .wk-tab.today:not(.on){border-color:var(--accent)}
  .wk-tab.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

const DAY_KEYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const PROFILES=["don","dars"];
const NAME={don:"Don",dars:"Dars"};
const WARMUP=5, FINISH=55, CAP=60;

/* ============================ STATE ============================ */
let profile="don", view="train", day=DAY_KEYS[(new Date().getDay()+6)%7];
let DATA=blankData();
let db=null;

function isoDate(d=new Date()){ const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4); return z.toISOString().slice(0,10); }
function mondayOf(d=new Date()){ const x=new Date(d); x.setDate(x.getDate()-((x.getDay()+6)%7)); return isoDate(x); }
function blankData(){ return { history:{}, current:{}, doneDays:{}, blockStart:isoDate(), weekOf:mondayOf() }; }
function exId(dk,name){ return dk+"__"+name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""); }
function setCount(s){ const m=s.match(/^(\d+)/); return m?Math.min(+m[1],6):3; }
function weeksSince(iso){ return iso?Math.floor((Date.now()-new Date(iso))/(7*864e5)):0; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmt(m){ return Math.floor(m/60)+":"+String(m%60).padStart(2,"0"); }

/* ---------- storage: shared db when available, browser storage otherwise ---------- */
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

async function initStore(){
  try{ if(window.claude && window.claude.use) db=await window.claude.use("db"); }catch(e){ db=null; }
}
async function load(p){
  let d=null, pushLocal=false;
  if(db){
    try{
      const snap=await db.doc("profiles/"+p).get();
      const base=snap.exists?JSON.parse(JSON.stringify(snap.data())):null;
      const hs=await db.collection("profiles/"+p+"/history").get();
      const history={};
      hs.docs.forEach(h=>{ const v=h.data(); if(v&&Array.isArray(v.entries)) history[h.id]=JSON.parse(JSON.stringify(v.entries)); });
      if(base){ d=Object.assign(blankData(),base,{history}); }
      else if(hs.size){ d=Object.assign(blankData(),{history}); }
      else { pushLocal=true; }
      setSync("Synced · shared between your devices");
    }catch(e){ setSync("Couldn't reach the shared log · saving on this device"); db=null; }
  }
  if(!d){
    const raw=lsGet("ddgym_v3_"+p);
    if(raw){ try{ d=Object.assign(blankData(),JSON.parse(raw)); }catch(e){} }
    if(!db) setSync("Saved on this device only");
  }
  d=d||blankData();
  if(pushLocal && Object.keys(d.history).length){   // first sync: copy this device's log up
    const keep=DATA; DATA=d; const pp=profile; profile=p;
    persist(); Object.keys(d.history).forEach(persistHistory);
    DATA=keep; profile=pp;
  }
  // new week: clear last week's checkmarks and inputs (history is kept)
  if(d.weekOf!==mondayOf()){ d.current={}; d.doneDays={}; d.weekOf=mondayOf(); }
  return d;
}
function setSync(t){ const el=document.getElementById("syncnote"); if(el) el.textContent=t; }

/* one write in flight per document; bursts coalesce */
const writers={};
function queueWrite(path,getBody){
  const w=writers[path]||(writers[path]={busy:false,dirty:false,timer:null});
  w.getBody=getBody; w.dirty=true;
  clearTimeout(w.timer);
  w.timer=setTimeout(()=>flush(path),600);
}
async function flush(path){
  const w=writers[path]; if(!w||w.busy||!w.dirty) return;
  w.busy=true; w.dirty=false;
  try{ await db.doc(path).set(w.getBody()); }catch(e){ setSync("Last save failed · will retry on your next change"); }
  w.busy=false;
  if(w.dirty) flush(path);
}
function persist(){
  const p=profile, snap=DATA;
  lsSet("ddgym_v3_"+p, JSON.stringify(snap));
  if(db) queueWrite("profiles/"+p,()=>({current:snap.current,doneDays:snap.doneDays,blockStart:snap.blockStart,weekOf:snap.weekOf}));
}
function persistHistory(id){
  const p=profile, entries=DATA.history[id]||[];
  lsSet("ddgym_v3_"+p, JSON.stringify(DATA));
  if(db) queueWrite("profiles/"+p+"/history/"+id,()=>({entries:entries.slice(-60)}));
}

/* ============================ METRICS ============================ */
const EFFORTS=[["easy","EASY"],["limit","LIMIT"],["fail","FAIL"]];
function emptySet(m){ return m==="load"?{w:"",r:""}:{r:"",e:""}; }
function topVal(m,sets){ if(!sets||!sets.length) return 0; return m==="load"?Math.max(...sets.map(s=>+s.w||0)):Math.max(...sets.map(s=>+s.r||0)); }
function ghostText(m,sets){ if(!sets||!sets.length) return "";
  return m==="load"?sets.map(s=>`${s.w||"–"}×${s.r||"–"}`).join("  "):sets.map(s=>`${s.r||"–"}${s.e?" "+s.e[0].toUpperCase():""}`).join("  "); }

/* ============================ RENDER ============================ */
function setProfile(p){
  if(p===profile) return;
  profile=p;
  document.body.dataset.profile=p;
  PROFILES.forEach(x=>document.getElementById("t-"+x).classList.toggle("on",x===p));
  initProfile();
}
async function initProfile(){
  document.getElementById("logo").textContent=META[profile].brand;
  document.getElementById("subtitle").textContent=META[profile].sub;
  document.getElementById("stats").innerHTML=META[profile].stats.map(([k,v])=>`<div class="stat">${k} <span>${v}</span></div>`).join("");
  const p=profile;
  const d=await load(p);
  if(p!==profile) return;
  DATA=d;
  renderStrip(); renderDays();
  if(view==="train") selectDay(day); else if(view==="progress") renderProgress(); else if(view==="plan") renderPlan(); else if(view==="gear") renderGear(); else renderWeek();
}
function renderStrip(){
  const wk=weeksSince(DATA.blockStart)+1;
  document.getElementById("blockwk").textContent="Block · week "+wk+(wk<=2?" · ramp-in: one set fewer per lift":"");
  document.getElementById("deloadwrap").innerHTML= wk>=7
    ? `<button class="deload" onclick="resetBlock()">Deload week done? Start a new block</button>`
    : `<span>deload around week 7</span>`;
}
function resetBlock(){ DATA.blockStart=isoDate(); persist(); renderStrip(); }

function setView(v){
  view=v;
  ["train","progress","plan","gear","week"].forEach(x=>document.getElementById("tab-"+x).classList.toggle("on",x===v));
  document.getElementById("trainview").hidden=v!=="train";
  document.getElementById("progview").hidden=v!=="progress";
  document.getElementById("planview").hidden=v!=="plan";
  document.getElementById("gearview").hidden=v!=="gear";
  document.getElementById("weekview").hidden=v!=="week";
  if(v==="train") selectDay(day); else if(v==="progress") renderProgress(); else if(v==="plan") renderPlan(); else if(v==="gear") renderGear(); else renderWeek();
}

function renderDays(){
  const sel=document.getElementById("days"); sel.innerHTML="";
  const tk=DAY_KEYS[(new Date().getDay()+6)%7];
  DAY_KEYS.forEach(dk=>{
    const d=PROGRAMS[profile][dk];
    const b=document.createElement("button");
    b.className="day-btn"+(dk===day?" active":"")+(dk===tk?" today":"")+(d.type!=="workout"?" rest":"")+(DATA.doneDays[dk]?" done":"");
    b.innerHTML=`<span class="abbr">${d.abbr}</span><span class="lab">${d.label}</span><div class="dot"></div>`;
    b.onclick=()=>selectDay(dk);
    sel.appendChild(b);
  });
}
function selectDay(dk){ day=dk; renderDays(); const host=document.getElementById("panel"); host.innerHTML=""; host.appendChild(buildPanel(dk)); updateProgress(dk); }

function liftMinutes(p,dk){ const d=PROGRAMS[p][dk]; return d.type==="workout"?d.blocks.reduce((s,b)=>s+b.min,0):0; }

function clockHTML(dk){
  const lanes=PROFILES.map(p=>{
    const d=PROGRAMS[p][dk]; const lift=liftMinutes(p,dk);
    const end=WARMUP+lift; const cardio=Math.max(0,FINISH-end);
    let segs=`<div class="seg w" style="width:${WARMUP/CAP*100}%" title="Warm-up together">WU</div>`;
    d.blocks.forEach((b,i)=>{ segs+=`<div class="seg ${p}${i%2?" alt":""}" style="width:${b.min/CAP*100}%" title="${esc(b.label)} · ${b.min} min">${b.min>=9?b.min+"′":""}</div>`; });
    segs+=`<div class="seg c" style="width:${cardio/CAP*100}%" title="${CARDIO[p]} · ${cardio} min">${cardio>=7?"cardio":""}</div>`;
    segs+=`<div class="seg b" style="width:${(CAP-FINISH)/CAP*100}%"></div>`;
    return {p,lift,end,cardio,html:`<div class="lane"><span class="lane-name${p===profile?" you":""}">${NAME[p].toUpperCase()}</span><div class="bar" role="img" aria-label="${NAME[p]}: lifting until ${fmt(end)}, then ${cardio} minutes of cardio">${segs}</div></div>`};
  });
  const me=lanes.find(l=>l.p===profile), other=lanes.find(l=>l.p!==profile);
  const gap=Math.abs(me.end-other.end);
  const first=me.end<=other.end?me:other;
  const note=gap<=3
    ? `You both finish lifting within ${gap||1} min of each other (about <b>${fmt(Math.max(me.end,other.end))}</b>), then do 10 min of easy cardio side by side.`
    : `<b>${NAME[first.p]}</b> finishes lifting about ${gap} min earlier (${fmt(first.end)}) and starts cardio first; the other joins at ${fmt(Math.max(me.end,other.end))}.`;
  return `<div class="clock">
    <div class="clock-head"><span class="clock-title">Session clock · ${GYM_SLOT[dk]?GYM_SLOT[dk]:"60 min"}</span><span class="clock-sum">done by ${fmt(FINISH)} · 5 min spare · then shower</span></div>
    ${lanes.map(l=>l.html).join("")}
    <div class="axis"><span></span><div class="ticks"><span style="left:0">0</span><span style="left:25%">15</span><span style="left:50%">30</span><span style="left:75%">45</span><span style="left:100%">60</span></div></div>
    <p class="lane-note">${note} Your cardio: <b>${me.cardio} min</b>; pick the machine in the cardio block at the bottom.</p>
    <div class="share">${esc(PROGRAMS[profile][dk].share)}</div>
  </div>`;
}

function buildPanel(dk){
  const d=PROGRAMS[profile][dk];
  const p=document.createElement("div"); p.className="panel";
  let head=`<div class="day-header"><div class="day-title"><span class="num">${d.abbr}</span> · ${d.label}</div>
    <div class="day-meta"><div class="day-tag">${d.tag}</div><div class="day-desc">${d.desc}</div></div></div>`;
  if(d.type!=="workout"){
    p.innerHTML=head+`<div class="restcard"><h3>${d.label}</h3><p>${d.text}</p><ul class="restlist">${d.items.map(i=>`<li>${i}</li>`).join("")}</ul></div>`;
    return p;
  }
  head+=clockHTML(dk)+`<div class="pbar"><div class="pfill" id="pfill"></div></div>`;
  let body="", gi=0;
  d.blocks.forEach(bl=>{
    const cls=bl.kind==="finisher"?"finisher":(bl.kind==="straight"?"straight":"");
    body+=`<div class="block ${cls}"><div class="block-label"><span class="pill">${bl.label}</span><span class="rest-lbl">rest ${bl.rest} · ~${bl.min} min</span></div><div class="howto">${bl.howto}</div>`;
    bl.ex.forEach((ex,ei)=>{
      if(ei>0) body+=`<div class="connector"><div class="cline"></div><span class="ctext">${bl.kind==="superset"?"THEN →":"NEXT"}</span><div class="cline"></div></div>`;
      body+=exCard(dk,gi++,ex);
    });
    body+=`</div>`;
  });
  const doneAll=DATA.doneDays[dk];
  body+=cardioHTML(dk)+showerHTML();
  body+=`<div class="complete-wrap"><button class="complete-btn${doneAll?" done":""}" id="cbtn" onclick="toggleDay('${dk}')">${doneAll?"✓ Day complete":"Mark day complete"}</button></div>`;
  body+=`<div class="timer"><button class="tface" id="tface" onclick="toggleTimer()" aria-label="Rest timer">REST</button><div class="tbtns">${[60,90,120,180].map(s=>`<button onclick="startTimer(${s})">${s<120?s:(s/60)+"m"}</button>`).join("")}</div></div>`;
  p.innerHTML=head+body;
  return p;
}

function exCard(dk,gi,ex){
  const id=exId(dk,ex.n);
  if(!DATA.current[dk]) DATA.current[dk]={};
  const cur=DATA.current[dk][id]||{};
  const sets=(cur.sets&&cur.sets.length)?cur.sets:Array.from({length:setCount(ex.s)},()=>emptySet(ex.m));
  DATA.current[dk][id]={sets,done:!!cur.done};
  const hist=DATA.history[id]||[], today=isoDate();
  const prev=[...hist].reverse().find(h=>h.date!==today)||null;
  const gtop=prev?topVal(ex.m,prev.sets):0;
  const pr=hist.reduce((m,h)=>Math.max(m,topVal(ex.m,h.sets)),0);
  let rows="";
  sets.forEach((s,i)=>{
    const v=topVal(ex.m,[s]); const beat=gtop>0&&v>=gtop;
    rows+=`<div class="setrow${beat?" beat":""}" data-id="${id}" data-set="${i}" data-dk="${dk}"><span class="setno">${i+1}</span>`;
    if(ex.m==="load"){
      rows+=`<input id="in-${id}-${i}-w" data-f="w" inputmode="decimal" placeholder="kg" aria-label="Set ${i+1} weight" value="${esc(s.w||"")}"><span class="sep">×</span><input id="in-${id}-${i}-r" data-f="r" inputmode="numeric" placeholder="reps" aria-label="Set ${i+1} reps" value="${esc(s.r||"")}">`;
    }else{
      rows+=`<input id="in-${id}-${i}-r" data-f="r" inputmode="numeric" placeholder="reps" aria-label="Set ${i+1} reps" value="${esc(s.r||"")}"><span class="effort">${EFFORTS.map(([k,l])=>`<button class="ebtn${s.e===k?" on":""}" data-e="${k}">${l}</button>`).join("")}</span>`;
    }
    rows+=`</div>`;
  });
  const ghost=prev?`last · ${ghostText(ex.m,prev.sets)}`:"no history yet · set your baseline";
  return `<div class="ex${cur.done?" done":""}" id="ex-${gi}" data-id="${id}" data-dk="${dk}">
    <div class="ex-head">
      <button class="check" onclick="toggleEx('${dk}',${gi},'${id}')" aria-label="Mark ${esc(ex.n)} done"><svg width="10" height="8" viewBox="0 0 10 8"><path d="M1 4L3.5 6.5L9 1" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg></button>
      <span class="ex-num">${String(gi+1).padStart(2,"0")}</span>
      <div class="ex-body">
        <div class="ex-name">${ex.n}${ex.main?'<span class="star" title="Key lift"></span>':""}</div>
        <div class="tags"><span class="tag tag-s">${ex.s}</span><span class="tag tag-m">${ex.mus}</span><span class="tag tag-k">${ex.k}</span></div>
        ${gearOf(ex)?`<button class="eqchip" onclick="openGear('${gearKey(ex)}')" aria-label="Equipment: ${esc(gearOf(ex).n)}. Open gear guide"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 4.5h1.5v3H1zM9.5 4.5H11v3H9.5zM2.5 3h1.5v6H2.5zM8 3h1.5v6H8zM4 5.4h4v1.2H4z" fill="currentColor"/></svg>${esc(gearOf(ex).n)}<span class="eqgo">guide →</span></button>`:""}

function toggleForm(gi){ const f=document.getElementById("form-"+gi), b=document.getElementById("ft-"+gi);

function toggleEx(dk,gi,id){
  const el=document.getElementById("ex-"+gi); const now=!el.classList.contains("done");
  el.classList.toggle("done",now);

  if(now) commitHistory(dk,id);

}
function commitHistory(dk,id){
  const sets=(DATA.current[dk][id].sets)||[];
  const clean=sets.filter(s=>(s.w&&s.w!=="")||(s.r&&s.r!==""));
  if(!clean.length) return;
  const h=DATA.history[id]||(DATA.history[id]=[]);
  const today=isoDate(); const entry={date:today,sets:clean.map(s=>({...s}))};
  const idx=h.findIndex(x=>x.date===today);
  if(idx>=0) h[idx]=entry; else h.push(entry);
  persistHistory(id);
}
function updateProgress(dk){
  const d=PROGRAMS[profile][dk]; if(d.type!=="workout") return;
  let total=0,done=0;
  d.blocks.forEach(b=>b.ex.forEach(ex=>{ total++; const c=DATA.current[dk]&&DATA.current[dk][exId(dk,ex.n)]; if(c&&c.done) done++; }));
  total++; if(DATA.current[dk]&&DATA.current[dk].cardio&&DATA.current[dk].cardio.done) done++;
  const f=document.getElementById("pfill"); if(f) f.style.width=Math.round(done/total*100)+"%";
}

function exFor(dk,id){ let r=null; PROGRAMS[profile][dk].blocks.forEach(b=>b.ex.forEach(x=>{ if(exId(dk,x.n)===id) r=x; })); return r; }

  const s=DATA.current[dk][id].sets[si]||(DATA.current[dk][id].sets[si]={});

function tierLine(name,best){

  return next?`<div class="u" style="margin-top:6px">next level: ${next[0]} ≈ ${Math.round(bw*next[1])} kg est. 1RM (${next[1]}× bodyweight)</div>`

      const id=exId(dk,ex.n), hist=DATA.history[id]||[]; const best=hist.reduce((m,h)=>Math.max(m,topVal(ex.m,h.sets)),0);

    d.blocks.forEach(b=>b.ex.forEach(ex=>{ const k=gearKey(ex); if(!k) return;
      if(!use[k]){ use[k]={who:new Set(),items:{}}; order.push(k); }
      use[k].who.add(p); const key=ex.n; (use[k].items[key]=use[k].items[key]||{p:new Set(),d:new Set()}); use[k].items[key].p.add(p); use[k].items[key].d.add(dk); })); }));
  Object.keys(CARDIO_OPTS).forEach(k=>{ const g=CARDIO_OPTS[k].gear; const who=PROFILES.filter(p=>CARDIO_ORDER[p].includes(k));
    use[g]={who:new Set(who),items:{"Cardio finisher":{p:new Set(who),d:new Set(DAY_KEYS.filter(k=>PROGRAMS.don[k].type==="workout"))}}}; order.push(g); });
  const areas=["Machines","Cables","Free weights","Bodyweight","Cardio"];
  let html=`<p class="prog-intro">Everything the plan uses, grouped by where it sits in the gym. Each exercise card on the Train tab links here. "How to use it" opens YouTube videos for that machine in a new tab.</p>`;
  areas.forEach(a=>{
    const ks=order.filter(k=>GEAR[k].area===a); if(!ks.length) return;
    html+=`<h3 class="gear-area">${a}</h3><div class="gear-grid">`;
    ks.forEach(k=>{ const g=GEAR[k], u=use[k];
      const who=PROFILES.filter(p=>u.who.has(p)).map(p=>`<span class="who ${p}">${NAME[p]}</span>`).join("");
      const items=Object.entries(u.items).map(([n,v])=>`<li><b>${esc(n)}</b> <span>${PROFILES.filter(p=>v.p.has(p)).map(p=>NAME[p]).join(" + ")} · ${DAY_KEYS.filter(d=>v.d.has(d)).join(", ")}</span></li>`).join("");
      html+=`<div class="gear" id="gear-${k}"><div class="gear-head"><span class="gear-name">${g.n}</span><span class="whos">${who}</span></div>
        <ul class="gear-uses">${items}</ul>
        <p class="gear-p"><b>Setup:</b> ${g.setup}</p><p class="gear-p"><b>If it's taken:</b> ${g.alt}</p>
        <a class="gear-link" href="${yt(g.q)}" target="_blank" rel="noopener">How to use it ↗</a></div>`; });
    html+=`</div>`;
  });
  document.getElementById("gearview").innerHTML=html;
}


/* ============================ WEEK (shared timeblock) ============================ */
const GYM_SLOT={Mon:"5:30–6:30 AM",Wed:"5:30–6:30 AM",Fri:"6:30–7:30 AM",Sat:"8:45–9:45 AM"};
const CATS={move:"Move / prep",commute:"Commute",work:"Work",home:"Home / Dustin",free:"Free time",sleep:"Wind down / sleep"};
function tm(h){ const [a,b]=h.split(":").map(Number); return a*60+(b||0); }      // "17:30" -> minutes
function clock12(m){ m=((m%1440)+1440)%1440; let h=Math.floor(m/60), mi=m%60; const ap=h<12?"AM":"PM"; h=h%12||12; return h+":"+String(mi).padStart(2,"0")+" "+ap; }
function span(a,b){ if(b==null) return clock12(a); const A=clock12(a),B=clock12(b); return A.slice(-2)===B.slice(-2)?A.slice(0,-3)+"–"+B:A+"–"+B; }
function B(s,e,t,d,c,o){ return Object.assign({s:tm(s),e:e?tm(e):null,t,d:d||"",c},o||{}); }

const REST_AM=(dk,walk)=>[

  Fri:{sub:"Gym + work from home",wake:"6:00 AM",lights:"10:30 PM",next:"Sat 6:30 AM",blocks:[

let wday=DAY_KEYS[(new Date().getDay()+6)%7];
function blockFor(b){ const o=b.byProfile&&b.byProfile[profile]; return o?Object.assign({},b,o):b; }
function nowMin(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }
function dur(m){ const h=Math.floor(m/60), mi=m%60; return (h?h+"h ":"")+(mi||!h?mi+"m":"").trim(); }
function gymDetail(dk){
  const s0=tm(GYM_SLOT[dk].split("–")[0].replace(/ ?[AP]M/,"")) + (GYM_SLOT[dk].includes("PM")?720:0);
  const end=s0+liftEnd(profile,dk);
  const other=PROFILES.find(x=>x!==profile);
  return `Warm-up together, then your <b>${PROGRAMS[profile][dk].label}</b> (${NAME[other]}: ${PROGRAMS[other][dk].label}). Lifting ends about ${clock12(end)}, then cardio until ${clock12(s0+FINISH)}.`;
}
function setWday(dk){ wday=dk; renderWeek(); }
function openSession(dk){ day=dk; setView("train"); window.scrollTo({top:0,behavior:"smooth"}); }
function renderWeek(){
  const w=WEEK[wday], todayKey=DAY_KEYS[(new Date().getDay()+6)%7], isToday=wday===todayKey, now=nowMin();
  const blocks=w.blocks.map(blockFor);
  let cur=-1; if(isToday) blocks.forEach((b,i)=>{ const e=b.e==null?b.s+1:b.e; if(now>=b.s&&now<e) cur=i; });
  const nextI=isToday?blocks.findIndex(b=>b.s>now):-1;
  const lo=blocks.find(b=>b.lights);
  let live="";
  if(isToday){
    const parts=[];
    if(cur>=0) parts.push(`<b>Now:</b> ${blocks[cur].t}`);
    if(nextI>=0) parts.push(`<b>Next:</b> ${blocks[nextI].t} in ${dur(blocks[nextI].s-now)}`);
    if(lo&&now<lo.s) parts.push(`<b>Lights out</b> in ${dur(lo.s-now)}`);
    live=`<div class="wk-live">${parts.join('<span class="dotsep">·</span>')||"Day's done. Sleep well."}</div>`;
  }
  const tabs=DAY_KEYS.map(dk=>`<button class="wk-tab${dk===wday?" on":""}${dk===todayKey?" today":""}" onclick="setWday('${dk}')"><span>${dk.toUpperCase()}</span><small>${WEEK[dk].wake.replace(" AM","").replace("by ","≤")}</small></button>`).join("");
  const rows=blocks.map((b,i)=>{
    const lbl=b.label||span(b.s,b.e);
    let extra="";
    if(b.gym) extra=`<p class="wk-d">${gymDetail(wday)}</p><button class="wk-go" onclick="openSession('${wday}')">Open today's session →</button>`;
    else if(b.train) extra=(b.d?`<p class="wk-d">${b.d}</p>`:"")+`<button class="wk-go ghosty" onclick="openSession('${b.train}')">See ${PROGRAMS[profile][b.train].label.toLowerCase()} card →</button>`;
    else if(b.d) extra=`<p class="wk-d">${b.d}</p>`;
    return `<li class="wk-row c-${b.c}${i===cur?" now":""}${b.lights?" lights":""}"><span class="wk-time">${lbl}</span><div class="wk-body"><span class="wk-t">${b.t}${i===cur?' <em>now</em>':""}</span>${extra}</div></li>`;
  }).join("");
  const legend=Object.entries(CATS).map(([k,v])=>`<span class="lg c-${k}"><i></i>${v}</span>`).join("");
  document.getElementById("weekview").innerHTML=`
    <div class="wk-tabs">${tabs}</div>
    <div class="wk-head"><div><div class="day-title">${wday==="Sun"?"Sunday":PROGRAMS[profile][wday].name}</div><div class="day-desc">${w.sub}</div></div>
      <div class="wk-facts"><span>Wake <b>${w.wake}</b></span><span>Gym <b>${GYM_SLOT[wday]||"—"}</b></span><span>Lights out <b>${w.lights}</b></span><span>Next alarm <b>${w.next}</b></span></div></div>
    ${live}
    <ol class="wk-list">${rows}</ol>
    <div class="wk-legend">${legend}</div>
    <div class="note wk-notes"><h4>House rules</h4><ul>
      <li><b>Lights out is 8 hours before the next alarm.</b> Before a 5:00 AM alarm that means 9:00 PM, and 9:30 at the latest.</li>
      <li><b>Only two 5:00 AM alarms a week</b> (Monday and Wednesday), and only two early bedtimes (Sunday and Tuesday).</li>
      <li><b>A 5:00 AM feels rough?</b> Skip the gym, not the sleep. Make the session up Sunday morning, or let it go that week.</li>
      <li><b>Saturday feels like too much?</b> Dars cuts step-ups first, then leg press. Keep the abduction.</li>
      <li><b>Weekend wake-up by 7:00 AM</b> at the latest, so Monday's alarm stays close to your weekend rhythm.</li>
      <li><b>Dinner ends about 2 hours before lights out.</b> Cook double and pack tomorrow's lunch; no cooking in the morning.</li>
      <li><b>Dustin</b> is alone from about 7:30 AM to 6:00 PM on office days. A midday walker once or twice a week would help.</li></ul></div>`;
}
